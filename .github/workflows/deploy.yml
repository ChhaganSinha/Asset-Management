name: Build & Deploy (AssetManagement)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: assetmanagement-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: "9.0.x"
      SERVICE_NAME: "assetmanagement"
      SERVER_DIR: "/var/Apps/AssetManagement"
      SERVER_PROJECT_PATH: "AssetManagement/Server/AssetManagement.Server.csproj"
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # Publishing the Server project also builds the Client and places it under wwwroot
      - name: Publish (Server)
        run: dotnet publish "${{ env.SERVER_PROJECT_PATH }}" -c Release -o published

      - name: Create deploy archive
        run: |
          cd published
          tar -czf ../deploy.tar.gz .

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ env.SSH_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: "/root/"

      - name: Deploy & restart service on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ env.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            SERVER_DIR="${{ env.SERVER_DIR }}"
            SERVICE_NAME="${{ env.SERVICE_NAME }}"

            mkdir -p "$SERVER_DIR"

            # Optional backup of current release (keep one)
            if [ -d "$SERVER_DIR" ]; then
              ts=$(date +%Y%m%d-%H%M%S)
              mkdir -p /var/backups/assetmanagement
              tar -czf "/var/backups/assetmanagement/release-$ts.tgz" -C "$SERVER_DIR" .
            fi

            # Unpack new release
            tar -xzf /root/deploy.tar.gz -C "$SERVER_DIR"
            rm -f /root/deploy.tar.gz

            # Ensure systemd picks up any unit changes and restart app
            systemctl daemon-reload
            systemctl restart "$SERVICE_NAME"
            systemctl --no-pager -l status "$SERVICE_NAME"

            # Quick local health check on Kestrel (Apache proxies 443->5003)
            curl -sSf http://127.0.0.1:5003/ >/dev/null && echo "App OK on 5003"
